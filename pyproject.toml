[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cs404-ecommerce-analytics"
version = "0.1.0"
description = "Kafka and Spark e-commerce analytics with explicit reliability guarantees"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pipeline = ["confluent-kafka==2.6.1", "psycopg[binary]==3.2.3"]
dashboard = ["streamlit==1.40.2", "plotly==5.24.1", "psycopg[binary]==3.2.3"]
test = ["pytest==8.3.4", "ruff==0.8.4", "PyYAML==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
