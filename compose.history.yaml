services:
  historical:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    profiles: [history]
    restart: 'no'
    mem_limit: 6g
    volumes:
      - ./data/history:/history
      - ./jobs:/app/jobs:ro
      - ./data/history/spark-tmp:/spark-tmp
    environment:
      SPARK_LOCAL_DIRS: /spark-tmp
    command: ['/opt/spark/bin/spark-submit', '--master', 'local[2]', '--driver-memory', '3g', '--conf', 'spark.sql.shuffle.partitions=24', '/app/jobs/customer_analytics.py']
