name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U commerce -d test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[test,pipeline]'
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://commerce:test-only@localhost:5432/test
      - run: python -m compileall -q src jobs dashboard scripts
      - run: docker compose config --quiet
        env: {POSTGRES_PASSWORD: test-only}
      - run: ruff check .
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: ci-test-only
      VERIFY_DASHBOARD_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build full stack
        run: docker compose -f compose.yaml -f compose.ci.yaml build
      - name: Install browser verification tools
        run: |
          pip install playwright==1.49.1
          python -m playwright install chromium --with-deps
      - name: Validate real Spark transforms
        run: docker compose run --rm --no-deps batch /opt/spark/bin/spark-submit --master 'local[2]' --driver-memory 1g /app/tests/spark_contract.py
      - name: Kafka Spark HDFS PostgreSQL dashboard and recovery
        run: python scripts/integration.py
      - name: Record actual dashboard demonstration
        run: python scripts/record_demo.py
        env: {DEMO_USE_CI: '1'}
      - name: Measure one and two worker finite workloads
        run: |
          python scripts/benchmark.py --ci --events 300 --trials 3 --workers 1
          python -c "from pathlib import Path; Path('reports/benchmark.json').rename('reports/benchmark-one-worker.json')"
          docker compose -f compose.yaml -f compose.ci.yaml --profile scale up -d spark-worker-2
          python scripts/benchmark.py --ci --events 300 --trials 3 --workers 2
          python -c "from pathlib import Path; Path('reports/benchmark.json').rename('reports/benchmark-two-workers.json')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: reports/
      - name: Stop test services
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml --profile scale down
